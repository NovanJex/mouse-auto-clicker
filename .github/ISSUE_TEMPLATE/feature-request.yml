name: 功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: 功能描述
      description: 清晰描述你想要的功能
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景
      description: 描述这个功能在什么场景下会用到
    validations:
      required: true
  - type: textarea
    attributes:
      label: 可能的实现方式
      description: 如果你对实现方式有任何想法，请描述
  - type: textarea
    attributes:
      label: 替代方案
      description: 是否有其他替代方案可以达到类似效果
